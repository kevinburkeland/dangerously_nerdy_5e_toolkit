name: 🐛 Bug Report
description: Report an issue, glitch, or unexpected behavior in the toolkit.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the issue.
      placeholder: When rolling batch attacks with Prone selected, the advantage calculation...
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open 'Animate Objects' screen
        2. Tap 'Batch Attack'
        3. Toggle 'Target Prone'
        4. See error/unexpected output
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: The roll mode should automatically switch to Advantage.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / Environment
      description: Which platform did you experience this on?
      options:
        - Web (Chrome / Chromium)
        - Web (Firefox)
        - Web (Safari)
        - Android (Installed PWA / APK)
        - Other (specify in description)
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context & Screenshots
      description: Add any other context, stack traces, console errors, or screenshots.
