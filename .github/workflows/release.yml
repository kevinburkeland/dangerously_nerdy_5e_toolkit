# =========================================================================
# DANGEROUSTNERDY 5E TOOLKIT - WEB-FIRST CI/CD RELEASE WORKFLOW
# =========================================================================

name: DangerouslyNerdy 5e Toolkit - CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      build_mobile:
        description: 'Build native mobile binaries (Android .aab / iOS .ipa)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # STAGE 1: VALIDATION & TESTING (SPLIT ACROSS PARALLEL JOBS)
  # -----------------------------------------------------------------------
  analyze:
    name: 🔍 Static Code Analysis & Strict Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Pub Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🔍 Static Code Analysis (Zero Warnings Guard)
        run: flutter analyze

      - name: 🔒 Verify Strict Analysis Ceilings
        run: ./scripts/check_strict_analysis.sh

  dependencies:
    name: 📦 Check Dependency Currency & Security
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: 📦 Install Pub Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🔍 Resolve Outdated Pub Dependencies
        run: flutter pub outdated --json --show-all > /tmp/pub_outdated.json

      - name: 📦 Install npm Dependencies
        working-directory: firestore_rules_test
        run: npm ci

      - name: 🔍 Resolve Outdated npm Dependencies & Audit
        working-directory: firestore_rules_test
        run: |
          npm outdated --json > /tmp/npm_outdated.json || true
          npm audit --json > /tmp/npm_audit.json || true

      - name: 🔒 Check Dependency Currency & Security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I scripts/check_dependencies.py --pub-outdated /tmp/pub_outdated.json --pubspec pubspec.yaml --workflows .github/workflows --exceptions dependency_exceptions.tsv --npm-dir firestore_rules_test --npm-outdated /tmp/npm_outdated.json --npm-audit /tmp/npm_audit.json

  test:
    name: 🧪 Unit & Widget Test Suite (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Pub Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🧪 Execute Sharded Unit & Widget Test Suite with Coverage
        run: |
          python3 -I scripts/test_shard.py list ${{ strategy.job-index }} ${{ strategy.job-total }} > "$RUNNER_TEMP/shard_files.txt"
          echo "Shard ${{ strategy.job-index }} of ${{ strategy.job-total }}: $(wc -l < "$RUNNER_TEMP/shard_files.txt") files"
          mapfile -t files < "$RUNNER_TEMP/shard_files.txt"
          [ "${#files[@]}" -gt 0 ] || { echo "empty shard"; exit 1; }
          flutter test --coverage "${files[@]}"

      - name: 📊 Upload Test Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-coverage-report-${{ strategy.job-index }}
          path: coverage/lcov.info

  web-tests:
    name: 🌐 Web Compiler Tests (Chrome)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Pub Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🌐 Web Compiler Tests (Chrome)
        run: flutter test --platform chrome test/application/services/map_slice_1_1_active_map_test.dart test/application/services/cold_iron_pass_7_1_reconcile_law_test.dart test/application/blob/blob_codec_test.dart test/application/blob/blob_transfer_examples_test.dart test/infrastructure/storage/web_blob_store_adapter_test.dart test/application/map/map_image_header_test.dart test/infrastructure/map/web_map_image_intake_adapter_test.dart test/application/map/map_slice_1_3_flow_test.dart test/infrastructure/adapters/webrtc_loopback_test.dart test/application/map/grid_geometry_law_test.dart

  tests-complete:
    name: 🏁 All Tests Complete Verification
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧪 Run Test Shard Script Self-Tests
        run: ./scripts/test_test_shard.sh

      - name: 🔒 Verify Test Sharding Integrity
        run: python3 -I scripts/test_shard.py check 4

      - name: 🔒 Verify Test Shard Workflow Configuration
        run: python3 -I scripts/test_shard.py check-workflow .github/workflows/release.yml

  # -----------------------------------------------------------------------
  # STAGE 2: FIRESTORE SECURITY RULES EMULATOR TESTS
  # -----------------------------------------------------------------------
  firestore-rules:
    name: 🔒 Firestore Security Rules Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ☕ Set up Java 21 (required by Firebase Emulator)
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'firestore_rules_test/package-lock.json'

      - name: 📦 Install Test Harness Dependencies
        working-directory: firestore_rules_test
        run: npm ci

      - name: 🧪 Execute Rules Tests in Firestore Emulator
        working-directory: firestore_rules_test
        run: npx firebase emulators:exec --only firestore --project demo-dnd5e "npm test"

  # -----------------------------------------------------------------------
  # STAGE 3: DCO SIGN-OFF & WORKFLOW PIN VERIFICATION
  # -----------------------------------------------------------------------
  dco:
    name: 📜 DCO Sign-off & Workflow Pin Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: 🧪 Run Action Pinning Script Self-Tests
        run: ./scripts/test_check_action_pins.sh

      - name: 🔒 Verify Action Pinning
        run: ./scripts/check_action_pins.sh

      - name: 🧪 Run DCO Script Self-Tests
        run: ./scripts/test_check_dco.sh

      - name: 📜 Verify Commit Sign-offs
        # Baseline 116bb9bad62d771bdee55a41df99536e1a1f4d68 is the newest unsigned commit in repository history.
        run: ./scripts/check_dco.sh 116bb9bad62d771bdee55a41df99536e1a1f4d68 HEAD

      - name: 🧪 Run Test Name Ratchet Script Self-Tests
        run: ./scripts/test_check_test_names.sh

      - name: 🔒 Verify Test Names Ratchet
        run: python3 -I scripts/check_test_names.py 12d9961f18614080b20cc0ac63c0185434f3757b HEAD

      - name: 🧪 Run Notes SHA Check Script Self-Tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/test_check_notes_shas.sh

      - name: 📥 Clone Sibling Repositories for SHA Validation
        run: |
          git clone --bare --filter=blob:none https://github.com/kevinburkeland/vtt-engine-core.git "$RUNNER_TEMP/core.git"
          git clone --bare --filter=blob:none https://github.com/kevinburkeland/vtt-ruleset-dnd5e.git "$RUNNER_TEMP/ruleset.git"

      - name: 🔒 Verify Notes Commit SHAs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/check_notes_shas.py --repo .=kevinburkeland/dangerously_nerdy_5e_toolkit --repo "$RUNNER_TEMP/core.git=kevinburkeland/vtt-engine-core" --repo "$RUNNER_TEMP/ruleset.git=kevinburkeland/vtt-ruleset-dnd5e" notes/*.md

      - name: 🧪 Run Mutation Branch Script Self-Tests
        run: ./scripts/test_check_mutation_branches.sh

      - name: 🧪 Run Retire Mutation Branches Script Self-Tests
        run: ./scripts/test_retire_mutation_branches.sh

      - name: 🧪 Run Dependency Check Script Self-Tests
        run: ./scripts/test_check_dependencies.sh

      - name: 🔒 Check Mutation Branches Limit
        run: ./scripts/check_mutation_branches.sh 20

  # -----------------------------------------------------------------------
  # STAGE 4: BUILD WEB PRODUCTION BUNDLE (PRIMARY WEB TARGET)
  # -----------------------------------------------------------------------
  build-web:
    name: 🌐 Build & Package Web Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🌐 Build Web Production Artifact
        run: ./scripts/build_web.sh

      - name: 📤 Upload Web Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-production-bundle
          path: build/web/

  # -----------------------------------------------------------------------
  # STAGE 5: BUILD ANDROID RELEASE (.AAB) - RELEASE OR OPT-IN ONLY
  # -----------------------------------------------------------------------
  build-android:
    name: 🤖 Build Android Release (.aab)
    needs: [analyze, tests-complete, web-tests]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_mobile == true)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ☕ Set up Java 17 (JDK)
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🔑 Decode & Inject Android Keystore Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets['ANDROID_KEYSTORE_BASE64'] }}
          KEY_PROPERTIES_BASE64: ${{ secrets['KEY_PROPERTIES_BASE64'] }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES_BASE64" ]; then
            echo "Injecting release keystore and key.properties..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            echo "$KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties
          else
            echo "⚠️ Release keystore secrets missing. Skipping key injection."
          fi

      - name: 🛠️ Build Signed & Obfuscated Android App Bundle (.aab)
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: 📤 Upload Android AAB Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: 🗺️ Upload Android Debug Symbol Maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-symbols
          path: build/app/outputs/symbols/

  # -----------------------------------------------------------------------
  # STAGE 6: BUILD IOS RELEASE (.IPA) - RELEASE OR OPT-IN ONLY
  # -----------------------------------------------------------------------
  build-ios:
    name: 🍎 Build iOS Release (.ipa)
    needs: [analyze, tests-complete, web-tests]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_mobile == true)
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🛠️ Build Obfuscated iOS App Archive (.ipa)
        run: |
          flutter build ipa --release \
            --obfuscate \
            --split-debug-info=build/ios/outputs/symbols \
            --no-codesign

      - name: 📤 Upload iOS IPA Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-ipa
          path: build/ios/archive/

      - name: 🗺️ Upload iOS Debug Symbol Maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-debug-symbols
          path: build/ios/outputs/symbols/
