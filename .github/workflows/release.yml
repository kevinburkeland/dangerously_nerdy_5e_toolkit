# =========================================================================
# DANGEROUSTNERDY 5E TOOLKIT - WEB-FIRST CI/CD RELEASE WORKFLOW
# =========================================================================

name: DangerouslyNerdy 5e Toolkit - CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: 🧭 Decide CI scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      scope: ${{ steps.decide.outputs.scope }}

    steps:
      - name: 📥 Checkout Repository (Parent History)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: 🧭 Decide CI Scope
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci_scope.py

  # -----------------------------------------------------------------------
  # STAGE 1: VALIDATION & TESTING (SPLIT ACROSS PARALLEL JOBS)
  # -----------------------------------------------------------------------
  analyze:
    name: 🔍 Static Code Analysis & Strict Analysis
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Pub Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🔍 Static Code Analysis (Zero Warnings Guard)
        run: flutter analyze

      - name: 🔒 Verify Strict Analysis Ceilings
        run: ./scripts/check_strict_analysis.sh

  dependencies:
    name: 📦 Check Dependency Currency & Security
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: 📦 Install Pub Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🔍 Resolve Outdated Pub Dependencies
        run: flutter pub outdated --json --show-all > /tmp/pub_outdated.json

      - name: 📦 Install npm Dependencies
        working-directory: firestore_rules_test
        run: npm ci

      - name: 🔍 Resolve Outdated npm Dependencies & Audit
        working-directory: firestore_rules_test
        run: |
          (npm outdated --json > /tmp/npm_outdated.json 2> /tmp/npm_outdated.stderr && echo 0 > /tmp/npm_outdated.status || echo $? > /tmp/npm_outdated.status)
          echo "npm outdated exit code: $(cat /tmp/npm_outdated.status)"
          cat /tmp/npm_outdated.stderr
          (npm audit --json > /tmp/npm_audit.json 2> /tmp/npm_audit.stderr && echo 0 > /tmp/npm_audit.status || echo $? > /tmp/npm_audit.status)
          echo "npm audit exit code: $(cat /tmp/npm_audit.status)"
          cat /tmp/npm_audit.stderr

      - name: 🔒 Check Dependency Currency & Security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I scripts/check_dependencies.py --pub-outdated /tmp/pub_outdated.json --pubspec pubspec.yaml --workflows .github/workflows --exceptions dependency_exceptions.tsv --npm-dir firestore_rules_test --npm-outdated /tmp/npm_outdated.json --npm-audit /tmp/npm_audit.json --npm-outdated-status /tmp/npm_outdated.status --npm-audit-status /tmp/npm_audit.status

  test:
    name: 🧪 Unit & Widget Test Suite (Shard ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Pub Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🧪 Execute Sharded Unit & Widget Test Suite with Coverage
        run: |
          python3 -I scripts/test_shard.py list ${{ strategy.job-index }} ${{ strategy.job-total }} > "$RUNNER_TEMP/shard_files.txt"
          echo "Shard ${{ strategy.job-index }} of ${{ strategy.job-total }}: $(wc -l < "$RUNNER_TEMP/shard_files.txt") files"
          mapfile -t files < "$RUNNER_TEMP/shard_files.txt"
          [ "${#files[@]}" -gt 0 ] || { echo "empty shard"; exit 1; }
          flutter test --coverage --file-reporter="json:$RUNNER_TEMP/shard_${{ strategy.job-index }}_report.json" "${files[@]}"

      - name: 📊 Upload Test Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-coverage-report-${{ strategy.job-index }}
          path: coverage/lcov.info

      - name: ⏱️ Upload Test Timing Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard_${{ strategy.job-index }}_report.json

  web-tests:
    name: 🌐 Web Compiler Tests (Chrome)
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Pub Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🌐 Web Compiler Tests (Chrome)
        run: flutter test --platform chrome test/application/services/map_slice_1_1_active_map_test.dart test/application/services/cold_iron_pass_7_1_reconcile_law_test.dart test/application/blob/blob_codec_test.dart test/application/blob/blob_transfer_examples_test.dart test/infrastructure/storage/web_blob_store_adapter_test.dart test/application/map/map_image_header_test.dart test/infrastructure/map/web_map_image_intake_adapter_test.dart test/application/map/map_slice_1_3_flow_test.dart test/infrastructure/adapters/webrtc_loopback_test.dart test/application/map/grid_geometry_law_test.dart test/infrastructure/adapters/remote/web_http_fetcher_chrome_test.dart test/services/persistence/hive_web_compatibility_chrome_test.dart

  tests-complete:
    name: 🏁 All Tests Complete Verification
    needs: [scope, test]
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧪 Run Test Shard Script Self-Tests
        run: ./scripts/test_test_shard.sh

      - name: 🔒 Verify Test Sharding Integrity
        run: python3 -I scripts/test_shard.py check 4

      - name: 🔒 Verify Test Shard Workflow Configuration
        run: python3 -I scripts/test_shard.py check-workflow .github/workflows/release.yml

      - name: 🧪 Run Notes Workflow Check Script Self-Tests
        run: ./scripts/test_check_notes_workflow.sh

      - name: 🔒 Verify Notes Workflow Configuration
        run: python3 -I scripts/check_notes_workflow.py .github/workflows/release.yml

      - name: 🧪 Run CI Scope Script Self-Tests
        run: ./scripts/test_ci_scope.sh

      - name: 🧪 Run CI Result Script Self-Tests
        run: ./scripts/test_ci_result.sh

      - name: 📥 Download Test Timing Reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-report-*
          path: ${{ runner.temp }}/shard_reports
          merge-multiple: true

      - name: ⏱️ Build Shard Weights from Reports
        run: python3 -I scripts/test_shard.py weights-from-reports "$RUNNER_TEMP/shard_reports" "$RUNNER_TEMP/shard_weights.json"

      - name: 📤 Upload Shard Weights Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-weights
          path: ${{ runner.temp }}/shard_weights.json

  # -----------------------------------------------------------------------
  # STAGE 2: FIRESTORE SECURITY RULES EMULATOR TESTS
  # -----------------------------------------------------------------------
  firestore-rules:
    name: 🔒 Firestore Security Rules Tests
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ☕ Set up Java 21 (required by Firebase Emulator)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'firestore_rules_test/package-lock.json'

      - name: 📦 Install Test Harness Dependencies
        working-directory: firestore_rules_test
        run: npm ci

      - name: 🧪 Execute Rules Tests in Firestore Emulator
        working-directory: firestore_rules_test
        run: npx firebase emulators:exec --only firestore --project demo-dnd5e "npm test"

  # -----------------------------------------------------------------------
  # STAGE 3: DCO SIGN-OFF & WORKFLOW PIN VERIFICATION
  # -----------------------------------------------------------------------
  dco:
    name: 📜 DCO Sign-off & Workflow Pin Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: 🧪 Run Action Pinning Script Self-Tests
        run: ./scripts/test_check_action_pins.sh

      - name: 🔒 Verify Action Pinning
        run: ./scripts/check_action_pins.sh

      - name: 🧪 Run DCO Script Self-Tests
        run: ./scripts/test_check_dco.sh

      - name: 📜 Verify Commit Sign-offs
        # Baseline 116bb9bad62d771bdee55a41df99536e1a1f4d68 is the newest unsigned commit in repository history.
        run: ./scripts/check_dco.sh 116bb9bad62d771bdee55a41df99536e1a1f4d68 HEAD

      - name: 🧪 Run Test Name Ratchet Script Self-Tests
        run: ./scripts/test_check_test_names.sh

      - name: 🔒 Verify Test Names Ratchet
        run: python3 -I scripts/check_test_names.py 12d9961f18614080b20cc0ac63c0185434f3757b HEAD

      - name: 🧪 Run Mutation Branch Script Self-Tests
        run: ./scripts/test_check_mutation_branches.sh

      - name: 🧪 Run Retire Mutation Branches Script Self-Tests
        run: ./scripts/test_retire_mutation_branches.sh

      - name: 🧪 Run Dependency Check Script Self-Tests
        run: ./scripts/test_check_dependencies.sh

      - name: 🧪 Run SRD Terms Script Self-Tests
        run: ./scripts/test_check_srd_terms.sh

      - name: 🔒 Check SRD Compliance Terms
        run: python3 -I scripts/check_srd_terms.py

      - name: 🔒 Check Mutation Branches Limit
        run: ./scripts/check_mutation_branches.sh 20

  notes-shas:
    name: 📝 Notes SHA Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: 🧪 Run Notes SHA Check Script Self-Tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/test_check_notes_shas.sh

      - name: 📥 Clone Sibling Repositories for SHA Validation
        run: |
          git clone --bare --filter=blob:none https://github.com/kevinburkeland/vtt-engine-core.git "$RUNNER_TEMP/core.git"
          git clone --bare --filter=blob:none https://github.com/kevinburkeland/vtt-ruleset-dnd5e.git "$RUNNER_TEMP/ruleset.git"

      - name: 🔒 Verify Notes Commit SHAs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/check_notes_shas.py --repo .=kevinburkeland/dangerously_nerdy_5e_toolkit --repo "$RUNNER_TEMP/core.git=kevinburkeland/vtt-engine-core" --repo "$RUNNER_TEMP/ruleset.git=kevinburkeland/vtt-ruleset-dnd5e" notes/*.md

  # -----------------------------------------------------------------------
  # STAGE 4: BUILD WEB PRODUCTION BUNDLE (PRIMARY WEB TARGET)
  # -----------------------------------------------------------------------
  build-web:
    name: 🌐 Build & Package Web Bundle
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 🌐 Build Web Production Artifact
        run: ./scripts/build_web.sh

      - name: 📤 Upload Web Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-production-bundle
          path: build/web/

  notes-text-checks:
    name: 📄 Notes text checks
    needs: scope
    if: needs.scope.outputs.scope == 'notes-only'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 💙 Set up Flutter SDK (Pinned Version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Pub Dependencies
        run: flutter pub get --enforce-lockfile

      - name: 📄 Run Repo-Text Tagged Tests
        run: flutter test --tags repo-text

  ci-result:
    name: ✅ CI result
    needs: [scope, analyze, dependencies, test, web-tests, tests-complete, firestore-rules, build-web, dco, notes-shas, notes-text-checks]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ✅ Verify All Job Results Match Scope
        run: |
          python3 -I scripts/ci_result.py \
            --scope "${{ needs.scope.outputs.scope }}" \
            --job scope=${{ needs.scope.result }} \
            --job analyze=${{ needs.analyze.result }} \
            --job dependencies=${{ needs.dependencies.result }} \
            --job test=${{ needs.test.result }} \
            --job web-tests=${{ needs.web-tests.result }} \
            --job tests-complete=${{ needs.tests-complete.result }} \
            --job firestore-rules=${{ needs.firestore-rules.result }} \
            --job build-web=${{ needs.build-web.result }} \
            --job dco=${{ needs.dco.result }} \
            --job notes-shas=${{ needs.notes-shas.result }} \
            --job notes-text-checks=${{ needs.notes-text-checks.result }}
