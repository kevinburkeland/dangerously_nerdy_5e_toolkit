<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="DangerouslyNerdy 5e Toolkit - 5e Combat Companion, Animate Objects Tracker, & Dice App">

  <!-- Content Security Policy (OWASP MASVS / Web Security) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://*.googleapis.com; img-src 'self' data: blob: https:; object-src 'none'; base-uri 'self';">

  <!-- HTTP Caching Headers / Cache Busting -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Mobile & Desktop Chrome PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="5e Toolkit">
  <meta name="theme-color" content="#14121E">

  <!-- Open Graph / Link Previews -->
  <meta property="og:title" content="DangerouslyNerdy 5e Toolkit">
  <meta property="og:description" content="5e Combat Companion, Animate Objects Tracker, & Batch Dice Roller App">
  <meta property="og:type" content="website">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon and Web App Icons -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="pwa_icons/Icon-192.png"/>

  <title>DangerouslyNerdy 5e Toolkit</title>
</head>
<body style="background-color: #14121E;">
  <script>
    // Register Fetch-enabled Service Worker for Chrome PWA Installation & Offline Support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(registration) {
          console.log('PWA ServiceWorker registration successful with scope: ', registration.scope);

          // Actively check for updates immediately on load
          registration.update();

          // Check for updates when user returns to the app from background
          document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
              registration.update();
            }
          });

          // Detect new service worker installing
          registration.addEventListener('updatefound', function() {
            const newWorker = registration.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('New PWA version detected. Triggering immediate update.');
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            }
          });
        }).catch(function(err) {
          console.log('PWA ServiceWorker registration failed: ', err);
        });

        // Auto-refresh when new service worker takes over to seamlessly show newest version
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            console.log('New service worker active: reloading to display updated app.');
            window.location.reload();
          }
        });
      });
    }

    // Capture Chrome beforeinstallprompt event for PWA address bar install button
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      console.log('Chrome PWA beforeinstallprompt captured.');
    });

    // In-App PWA Install trigger function called by Flutter
    function triggerPwaInstall() {
      if (window.matchMedia('(display-mode: standalone)').matches) {
        alert('DangerouslyNerdy 5e Toolkit is already running as an installed application!');
        return;
      }
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        window.deferredPrompt.userChoice.then((choiceResult) => {
          console.log('PWA User choice: ', choiceResult.outcome);
          window.deferredPrompt = null;
        });
      } else {
        alert('To install DangerouslyNerdy 5e Toolkit on Desktop Chrome:\n\n1. Look at the right side of your Chrome address bar for the Install computer icon.\n2. Or open Chrome Menu (⋮) -> "Save and share" -> "Install 5e Toolkit...".');
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
