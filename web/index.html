<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="DangerouslyNerdy 5e Toolkit - 5e Combat Companion, Animate Objects Tracker, & Dice App">

  <!-- Content Security Policy (OWASP MASVS / Web Security with App Check & reCAPTCHA support) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com https://*.gstatic.com https://www.google.com https://*.google.com https://www.recaptcha.net https://*.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https://www.gstatic.com https://*.gstatic.com https://fonts.gstatic.com https://fonts.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.googleapis.com https://www.google.com https://*.google.com https://www.recaptcha.net https://*.recaptcha.net; frame-src 'self' https://www.google.com https://*.google.com https://www.recaptcha.net https://*.recaptcha.net; child-src 'self' blob: https://www.google.com https://*.google.com https://www.recaptcha.net https://*.recaptcha.net; img-src 'self' data: blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self';">

  <!-- HTTP Caching Headers / Cache Busting -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Mobile & Desktop Chrome PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="5e Toolkit">
  <meta name="theme-color" content="#14121E">

  <!-- Open Graph / Link Previews -->
  <meta property="og:title" content="DangerouslyNerdy 5e Toolkit">
  <meta property="og:description" content="5e Combat Companion, Animate Objects Tracker, & Batch Dice Roller App">
  <meta property="og:type" content="website">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon and Web App Icons -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="pwa_icons/Icon-192.png"/>

  <title>DangerouslyNerdy 5e Toolkit</title>
</head>
<body style="background-color: #14121E;">
  <script>
    // Capture Chrome beforeinstallprompt event for PWA address bar install button
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      console.log('Chrome PWA beforeinstallprompt captured.');
    });

    // In-App PWA Install trigger function called by Flutter
    function triggerPwaInstall() {
      if (window.matchMedia('(display-mode: standalone)').matches) {
        alert('DangerouslyNerdy 5e Toolkit is already running as an installed application!');
        return;
      }
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        window.deferredPrompt.userChoice.then((choiceResult) => {
          console.log('PWA User choice: ', choiceResult.outcome);
          window.deferredPrompt = null;
        });
      } else {
        alert('To install DangerouslyNerdy 5e Toolkit on Desktop Chrome:\n\n1. Look at the right side of your Chrome address bar for the Install computer icon.\n2. Or open Chrome Menu (⋮) -> "Save and share" -> "Install 5e Toolkit...".');
      }
    }

    // Auto-reload on ServiceWorker controller change to ensure fresh version renders immediately
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('[PWA] ServiceWorker updated. Refreshing page for latest release...');
          window.location.reload();
        }
      });
    }

    // Dynamic cache-busted Flutter bootstrap script loader
    (function() {
      const buildVersion = 'BUILD_TIMESTAMP_PLACEHOLDER';
      const versionTag = buildVersion.includes('PLACEHOLDER') ? Date.now() : buildVersion;
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + versionTag;
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
