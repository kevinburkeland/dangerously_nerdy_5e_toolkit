name: dangerously_nerdy_5e_toolkit
description: "DangerouslyNerdy 5e Toolkit: A 5e-compatible combat companion, character builder, and batch dice roller built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_crashlytics: ^5.4.0
  shared_preferences: ^2.5.5
  firebase_app_check: ^0.4.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.0
  vtt_engine_core:
    git:
      url: https://github.com/kevinburkeland/vtt-engine-core.git
      ref: 926e7b251a8df1e5a5eb8eac2056fa712858f4d1
  vtt_ruleset_dnd5e:
    git:
      url: https://github.com/kevinburkeland/vtt-ruleset-dnd5e.git
      ref: acb0a63e6a98d50cb3742f1ca93d5411fad5fcb2
  meta: ^1.19.0
  uuid: ^4.6.0
  flutter_webrtc: ^1.6.2+hotfix.1
  fast_immutable_collections: ^11.1.0
  collection: ^1.18.0
  mutex: ^3.1.0
  web: ^1.1.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  shared_preferences_platform_interface: ^2.4.2
  mutation_test: ^1.8.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
