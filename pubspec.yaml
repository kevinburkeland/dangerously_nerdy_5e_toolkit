name: dangerously_nerdy_5e_toolkit
description: "DangerouslyNerdy 5e Toolkit: A 5e-compatible combat companion, character builder, and batch dice roller built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_crashlytics: ^6.0.1
  shared_preferences: ^2.5.6
  firebase_app_check: ^0.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^13.3.3
  url_launcher: ^6.3.3
  vtt_engine_core:
    git:
      url: https://github.com/kevinburkeland/vtt-engine-core.git
      ref: 0617617e954e0add7898a00cf5f9b4ec3334525e
  vtt_ruleset_dnd5e:
    git:
      url: https://github.com/kevinburkeland/vtt-ruleset-dnd5e.git
      ref: a19c4acd1a35b1f29420ca3824a214766c694f91
  meta: ^1.19.0
  uuid: ^4.6.0
  flutter_webrtc: ^1.6.3
  fast_immutable_collections: ^12.0.0
  collection: ^1.19.1
  mutex: ^3.1.0
  web: ^1.1.2
  crypto: ^3.0.8
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  shared_preferences_platform_interface: ^2.4.2
  mutation_test: ^1.8.1
  yaml: ^3.1.4

flutter:
  uses-material-design: true
