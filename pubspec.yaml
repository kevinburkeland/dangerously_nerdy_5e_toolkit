name: dangerously_nerdy_5e_toolkit
description: "DangerouslyNerdy 5e Toolkit: A 5e-compatible combat companion, Animate Objects tracker, and batch dice roller built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  cloud_firestore: ^5.1.0
  firebase_crashlytics: ^4.1.0
  shared_preferences: ^2.5.5
  firebase_app_check: ^0.3.1+4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
